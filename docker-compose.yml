services:
  firewalla-bridge:
    build: .
    container_name: firewalla-bridge
    restart: unless-stopped
    ports:
      - "${PORT:-7153}:${PORT:-7153}"
    environment:
      - PORT=${PORT:-7153}
      - FIREWALLA_IP=${FIREWALLA_IP:-192.168.1.1}
      - KEY_DIR=/app/keys
      - BOX_NAME=${BOX_NAME:-Firewalla Purple}
      # Optional: Configurable CORS origin (defaults to '*' for LAN dashboards)
      # - CORS_ORIGIN=*
      # Optional: Secure with API token (Header "Authorization: Token <token>")
      # - API_TOKEN=your_token_here
      # Optional: Merge bonded/multi-NIC servers (Name:IP:MAC1,MAC2 or Name|IP|MAC1,MAC2)
      # - MERGE_DEVICES=Server:192.168.1.100:aa:bb:cc:dd:ee:01,aa:bb:cc:dd:ee:02
    volumes:
      - ./keys:/app/keys
